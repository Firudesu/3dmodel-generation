<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image → 3D Model → Voxel Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px;
            margin: 30px 0;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        
        .upload-area:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }
        
        .upload-area.dragover {
            border-color: #667eea;
            background-color: #f0f2ff;
        }
        
        .upload-icon {
            font-size: 3em;
            color: #ddd;
            margin-bottom: 20px;
        }
        
        .upload-text {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            font-size: 0.9em;
            color: #999;
        }
        
        #file-input {
            display: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .progress-container {
            margin: 30px 0;
            display: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .status-text {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 5px;
        }
        
        .task-text {
            font-size: 0.9em;
            color: #666;
        }
        
        .error {
            background-color: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        
        .files-container {
            margin: 30px 0;
            display: none;
        }
        
        .file-item {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-name {
            font-weight: 500;
            color: #333;
        }
        
        .file-type {
            background-color: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        
        .download-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.9em;
            transition: background-color 0.3s ease;
        }
        
        .download-btn:hover {
            background-color: #218838;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Image → 3D Model → Voxel</h1>
        <p class="subtitle">Convert your images to 3D models and voxel files automatically</p>
        
        <div class="upload-area" id="upload-area">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Click to select an image or drag and drop</div>
            <div class="upload-hint">Supports JPG, PNG, GIF, BMP (Max 16MB)</div>
            <input type="file" id="file-input" accept="image/*">
        </div>
        
        <button class="btn" id="upload-btn" disabled>Select Image First</button>
        
        <div class="progress-container" id="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="status-text" id="status-text">Ready</div>
            <div class="task-text" id="task-text"></div>
        </div>
        
        <div class="error" id="error-message"></div>
        
        <div class="files-container" id="files-container">
            <h3>Generated Files</h3>
            <div id="files-list"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');
        const taskText = document.getElementById('task-text');
        const errorMessage = document.getElementById('error-message');
        const filesContainer = document.getElementById('files-container');
        const filesList = document.getElementById('files-list');
        
        let selectedFile = null;
        let statusInterval = null;
        
        // File selection
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect();
            }
        });
        
        function handleFileSelect() {
            const file = fileInput.files[0];
            if (file) {
                selectedFile = file;
                uploadArea.innerHTML = `
                    <div class="upload-icon">✅</div>
                    <div class="upload-text">${file.name}</div>
                    <div class="upload-hint">Click to change file</div>
                `;
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Start Conversion';
            }
        }
        
        // Upload and process
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            try {
                uploadBtn.disabled = true;
                uploadBtn.innerHTML = '<span class="loading"></span>Uploading...';
                progressContainer.style.display = 'block';
                filesContainer.style.display = 'none';
                errorMessage.style.display = 'none';
                
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    uploadBtn.innerHTML = '<span class="loading"></span>Processing...';
                    startStatusPolling();
                } else {
                    throw new Error(result.error || 'Upload failed');
                }
            } catch (error) {
                showError(error.message);
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Start Conversion';
            }
        });
        
        function startStatusPolling() {
            statusInterval = setInterval(async () => {
                try {
                    const response = await fetch('/status');
                    const status = await response.json();
                    
                    updateProgress(status);
                    
                    if (status.status === 'Complete!' || status.status === 'Error') {
                        clearInterval(statusInterval);
                        uploadBtn.disabled = false;
                        uploadBtn.textContent = 'Convert Another Image';
                        
                        if (status.status === 'Complete!') {
                            showFiles(status.files);
                        }
                    }
                } catch (error) {
                    console.error('Status polling error:', error);
                }
            }, 1000);
        }
        
        function updateProgress(status) {
            progressFill.style.width = status.progress + '%';
            statusText.textContent = status.status;
            taskText.textContent = status.task;
            
            if (status.error) {
                showError(status.error);
            }
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            progressContainer.style.display = 'none';
        }
        
        function showFiles(files) {
            filesList.innerHTML = '';
            files.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div>
                        <span class="file-name">${file.name}</span>
                        <span class="file-type">${file.type.toUpperCase()}</span>
                    </div>
                    <a href="/download/${file.path.split('/').pop()}" class="download-btn">Download</a>
                `;
                filesList.appendChild(fileItem);
            });
            filesContainer.style.display = 'block';
        }
    </script>
</body>
</html>
